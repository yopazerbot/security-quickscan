name: CI
on:
  push: { branches: [main] }
  pull_request:
  # The Docker workflow runs the full CI first and only publishes when it passes.
  workflow_call:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: quickscan_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { TEST_DATABASE_URL: 'postgres://postgres:ci@localhost:5432/quickscan_test' }
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: quickscan_e2e }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: scripts/e2e-local.sh
        env: { DATABASE_URL: 'postgres://postgres:ci@localhost:5432/quickscan_e2e', CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: 'playwright-report/', retention-days: 7 }
