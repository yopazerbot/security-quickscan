# Run Security QuickScan locally on your own machine (no login, localhost only):
#
#   docker compose up -d                 # uses the published image
#   docker compose up -d --build         # or build from this source tree
#
# Then open http://localhost:8080. Stop with: docker compose down  (data is kept in volumes)
name: security-quickscan

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quickscan
      POSTGRES_PASSWORD: quickscan   # only reachable inside this compose network (no published port)
      POSTGRES_DB: quickscan
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickscan"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ghcr.io/yopazerbot/security-quickscan:latest
    build: .
    environment:
      LOCAL_MODE: "true"
      DATABASE_URL: postgres://quickscan:quickscan@db:5432/quickscan
      # Demo mode and scanner identities are set in the app under Settings. These variables are optional
      # shortcuts, e.g. DEMO_MODE=true for the fictional demo organisation and simulated systems.
      DEMO_MODE: ${DEMO_MODE:-}
      SCANNER_AWS_ACCESS_KEY_ID: ${SCANNER_AWS_ACCESS_KEY_ID:-}
      SCANNER_AWS_SECRET_ACCESS_KEY: ${SCANNER_AWS_SECRET_ACCESS_KEY:-}
      SCANNER_MS_CLIENT_ID: ${SCANNER_MS_CLIENT_ID:-}
      SCANNER_MS_CLIENT_SECRET: ${SCANNER_MS_CLIENT_SECRET:-}
    ports:
      # Published on loopback only: the app has no login in local mode.
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - appdata:/data   # generated master key (encrypts stored credentials)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  appdata:
