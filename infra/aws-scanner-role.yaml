AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Least-privilege read-only role for Security QuickScan. Deploy in the AWS account to assess (us-east-1),
  share the RoleArn output with whoever runs the scan and delete the stack after the assessment.
Parameters:
  ScannerPrincipalArn:
    Type: String
    Description: ARN of the Security QuickScan platform identity (shown in the app).
  ExternalId:
    Type: String
    Description: Scan-specific external ID (shown in the app).
Resources:
  QuickScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SecurityQuickScanReadOnly
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ScannerPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: SecurityQuickScanReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Resource: '*'
                Action:
                  - access-analyzer:ListAnalyzers
                  - backup:ListBackupPlans
                  - backup:ListBackupSelections
                  - backup:ListBackupVaults
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetEventSelectors
                  - cloudtrail:GetTrailStatus
                  - config:DescribeConfigurationRecorderStatus
                  - config:DescribeConfigurationRecorders
                  - config:DescribeDeliveryChannels
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeRegions
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSnapshots
                  - ec2:DescribeVpcs
                  - ec2:GetEbsEncryptionByDefault
                  - guardduty:GetDetector
                  - guardduty:ListDetectors
                  - iam:GenerateCredentialReport
                  - iam:GetAccountAuthorizationDetails
                  - iam:GetAccountPasswordPolicy
                  - iam:GetAccountSummary
                  - iam:GetCredentialReport
                  - iam:ListVirtualMFADevices
                  - inspector2:BatchGetAccountStatus
                  - inspector2:ListFindings
                  - kms:DescribeKey
                  - kms:GetKeyRotationStatus
                  - kms:ListKeys
                  - rds:DescribeDBClusterSnapshotAttributes
                  - rds:DescribeDBClusterSnapshots
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSnapshotAttributes
                  - rds:DescribeDBSnapshots
                  - s3:GetAccountPublicAccessBlock
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:ListAllMyBuckets
                  - securityhub:DescribeHub
                  - securityhub:GetEnabledStandards
                  - securityhub:GetFindings
Outputs:
  RoleArn:
    Value: !GetAtt QuickScanRole.Arn
